# OpenAPI description of the Vigilo backend (https://github.com/jesuisundesdeux/vigilo-backend).
# Rendered with Swagger UI on /fr/api/. The list of servers (one per instance) is added
# when the site is built, from vigilo-conf.
openapi: 3.0.3
info:
  title: API Vigilo
  version: 0.0.26
  description: |
    API REST des instances [vigilo-backend](https://github.com/jesuisundesdeux/vigilo-backend).

    Chaque territoire a sa propre instance : choisissez-la dans la liste **Servers** ci-dessous,
    puis indiquez son **scope** (affiché sur la page de chaque ville). La liste des instances
    est publiée dans [vigilo-conf](https://github.com/jesuisundesdeux/vigilo-conf/blob/main/main/citylist.json).

    Les observations sont des données ouvertes sous licence CC0. Les appels en lecture (`GET`) peuvent
    être testés directement depuis cette page (bouton **Try it out**).

    En cas d'erreur, les méthodes répondent avec le code HTTP correspondant et un objet
    [`Error`](#/components/schemas/Error). La colonne « Compatibilité » de l'ancienne documentation
    est reprise dans les descriptions (« backend ≥ 0.0.x »).

    Authentification : `key` est la clé privée d'un compte de l'instance (admin ou modérateur pour les droits
    supplémentaires de cette API) ; `secretid` est la clé secrète d'une observation, retournée à sa création, qui
    identifie son auteur. Référence détaillée :
    [doc/REST_API.md](https://github.com/jesuisundesdeux/vigilo-backend/blob/master/doc/REST_API.md).
  license:
    name: AGPL-3.0 (code) / CC0 (données)
    url: https://github.com/jesuisundesdeux/vigilo-backend/blob/master/LICENSE
servers: []
tags:
  - name: Observations
    description: Lecture des observations et de leurs images
  - name: Contribution
    description: Création d'observations, ajout de photos, résolutions
  - name: Modération
    description: Méthodes réservées aux modérateurs (clé privée)
  - name: Configuration
    description: Informations sur l'instance
paths:
  /get_scope.php:
    get:
      tags: [Configuration]
      summary: Informations sur le scope (territoire)
      description: Backend ≥ 0.0.4.
      operationId: getScope
      parameters:
        - $ref: '#/components/parameters/scope'
      responses:
        '200':
          description: Informations du scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scope' }
        '404': { $ref: '#/components/responses/Error' }
  /get_version.php:
    get:
      tags: [Configuration]
      summary: Version du backend
      operationId: getVersion
      responses:
        '200':
          description: Version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: 0.0.26 }
  /get_categories.php:
    get:
      tags: [Configuration]
      summary: Catégories de l'instance
      description: |
        Backend ≥ 0.0.23. Liste nationale ([vigilo-conf](https://raw.githubusercontent.com/jesuisundesdeux/vigilo-conf/main/main/categorielist.json)),
        où les catégories désactivées par l'instance ont `catdisable: true` (elles restent listées pour nommer les
        observations existantes), suivie des catégories propres à l'instance (`catcustom: true`, numéros à partir
        de 1000). Réponse mise en cache 5 minutes. Sur une instance antérieure, la route répond 404 : utiliser la
        liste nationale de vigilo-conf.
      operationId: getCategories
      responses:
        '200':
          description: Catégories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /get_issues.php:
    get:
      tags: [Observations]
      summary: Liste des observations
      description: |
        Observations du scope dont la photo a été reçue, les plus récentes d'abord : les approuvées, plus celles à
        modérer si l'instance publie les observations non modérées ou avec une clé admin/modérateur. Les
        observations résolues depuis plus de N jours peuvent être masquées par l'instance (réglage, backend ≥ 0.0.22),
        sauf avec une clé. Un paramètre invalide donne une erreur 500 sans corps JSON. Backend ≥ 0.0.1 ;
        la compatibilité de chaque filtre est indiquée dans sa description.
      operationId: getIssues
      parameters:
        - $ref: '#/components/parameters/scopeOptional'
        - name: format
          in: query
          description: Format de sortie (backend ≥ 0.0.3)
          schema: { type: string, enum: [json, geojson, csv], default: json }
        - name: count
          in: query
          description: Nombre maximum d'observations (appliqué avant les filtres `status`, `lat`/`lon`/`radius` et `tokenfilters`)
          schema: { type: integer, minimum: 1 }
          example: 20
        - name: c
          in: query
          description: Filtre par catégorie ; plusieurs identifiants séparés par des virgules
          schema: { type: string }
          example: '2,3'
        - name: status
          in: query
          description: Filtre par statut de résolution (voir `Issue.status`)
          schema: { type: integer, enum: [0, 1, 2, 3, 4] }
        - name: t
          in: query
          description: Observations postérieures à ce timestamp Unix (backend ≥ 0.0.5)
          schema: { type: integer }
        - name: since
          in: query
          description: Filtre relatif sur la date, en nombre d'unités `since_unit` (backend ≥ 0.0.19)
          schema: { type: integer }
        - name: since_unit
          in: query
          description: Unité du filtre `since` (backend ≥ 0.0.19)
          schema: { type: string, enum: [day, week, month, year] }
        - name: token
          in: query
          description: Une observation précise
          schema: { type: string }
        - name: tokenfilters
          in: query
          description: |
            Avec `token` : observations similaires, selon les filtres `distance`, `categorie` et/ou `address`
            séparés par des virgules (backend ≥ 0.0.9)
          schema: { type: string }
          example: distance,categorie
        - name: fdistance
          in: query
          description: Distance en mètres, obligatoire avec le filtre `distance` de `tokenfilters`
          schema: { type: integer }
        - name: lat
          in: query
          description: Latitude du centre de recherche (avec `lon` et `radius`)
          schema: { type: number, format: double }
        - name: lon
          in: query
          description: Longitude du centre de recherche
          schema: { type: number, format: double }
        - name: radius
          in: query
          description: Rayon de recherche en mètres autour de `lat`/`lon` (les trois sont nécessaires ; ajoute le champ `distance`)
          schema: { type: integer }
        - name: approved
          in: query
          description: |
            Filtre selon l'approbation (backend ≥ 0.0.10). Sans clé admin/modérateur, seul `1` est accepté (et `0` si
            l'instance publie les observations non modérées) ; sinon la liste est vide.
          schema: { type: integer, enum: [0, 1, 2] }
        - name: cityid
          in: query
          description: Filtre par identifiant de commune (backend ≥ 0.0.13)
          schema: { type: integer }
        - name: cityfield
          in: query
          description: "1 : la commune est retournée dans `cityname` au lieu d'être ajoutée à l'adresse (backend ≥ 0.0.13)"
          schema: { type: integer, enum: [0, 1] }
        - name: key
          in: query
          description: Clé admin/modérateur (backend ≥ 0.0.13) - observations à modérer et résolues masquées
          schema: { type: string }
      responses:
        '200':
          description: Observations
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: '#/components/schemas/Issue' }
                  - $ref: '#/components/schemas/IssueFeatureCollection'
            text/csv:
              schema: { type: string }
  /generate_panel.php:
    get:
      tags: [Observations]
      summary: Image de l'observation (ex-panneau)
      description: |
        Depuis le backend 0.0.22, renvoie la photo de l'observation (le panneau composé photo, carte et textes n'est
        plus généré), pixelisée tant qu'elle n'est pas approuvée, sauf avec le `secretid` de l'auteur ou une clé
        admin/modérateur. JPEG depuis le backend 0.0.5 (PNG avant). Observation sans photo : 404 `PHOTONOTFOUND`
        (backend ≥ 0.0.23), afficher une image par défaut.
      operationId: generatePanel
      parameters:
        - $ref: '#/components/parameters/token'
        - name: s
          in: query
          description: Largeur maximale de l'image en pixels (1 à 1024, 1024 par défaut)
          schema: { type: integer, minimum: 1, maximum: 1024 }
          example: 800
        - $ref: '#/components/parameters/keyOptional'
        - $ref: '#/components/parameters/secretidOptional'
      responses:
        '200':
          description: Image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /get_photo.php:
    get:
      tags: [Observations]
      summary: Photo originale de l'observation
      description: |
        Photo de l'observation (ou de sa résolution avec `type=resolution`). Accessible pour les
        observations approuvées et les résolutions, ou avec une clé admin/modérateur, ou avec un lien signé
        `exp` + `sig` (variable `{{photo_full_url}}` des webhooks, backend ≥ 0.0.26) ; 403 `NOTALLOWED` sinon
        (version pixelisée : `generate_panel.php`). Pas de photo : 404 `PHOTONOTFOUND` (backend ≥ 0.0.23).
      operationId: getPhoto
      parameters:
        - $ref: '#/components/parameters/token'
        - name: type
          in: query
          description: Photo de l'observation ou de la résolution (backend ≥ 0.0.14)
          schema: { type: string, enum: [obs, resolution], default: obs }
        - $ref: '#/components/parameters/keyOptional'
        - name: exp
          in: query
          description: "Lien signé : date d'expiration (timestamp Unix), avec `sig` (backend ≥ 0.0.26)"
          schema: { type: integer }
        - name: sig
          in: query
          description: "Lien signé : HMAC-SHA256 de `token|exp` par un secret de l'instance (backend ≥ 0.0.26)"
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: Photo
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /create_issue.php:
    post:
      tags: [Contribution]
      summary: Créer (ou modifier) une observation
      description: |
        Première étape de l'ajout d'une observation, suivie de l'envoi de la photo
        ([`add_image.php`](#/Contribution/addImage)). Retourne le `token` de l'observation et sa clé
        secrète `secretid`, à conserver pour la compléter ou la supprimer.
        Avec `token` et une clé admin/modérateur, modifie une observation existante. Les coordonnées doivent être
        dans le rectangle du scope. Limitation par IP (backend ≥ 0.0.22) : 429 `RATELIMITED` avec
        `Retry-After: 600` au-delà du seuil de l'instance sur 10 minutes, sauf avec une clé admin/modérateur.
      operationId: createIssue
      parameters:
        - $ref: '#/components/parameters/keyOptional'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [coordinates_lat, coordinates_lon, categorie, address, time, scope]
              properties:
                token: { type: string, description: Uniquement pour modifier une observation (avec `key`) }
                coordinates_lat: { type: string, example: '43.6109' }
                coordinates_lon: { type: string, example: '3.8772' }
                categorie: { type: integer, description: Identifiant de catégorie }
                address: { type: string }
                comment: { type: string, maxLength: 50, description: "Remarque courte (tronquée à 50 caractères)" }
                explanation: { type: string }
                time: { type: integer, description: "Timestamp Unix en millisecondes (13 chiffres) ou en secondes" }
                version: { type: string, description: Version du client }
                scope: { type: string }
                cityid: { type: integer, description: Identifiant de la commune (backend ≥ 0.0.13) }
                cityname: { type: string, description: Nom de la commune (backend ≥ 0.0.13) }
      responses:
        '200':
          description: Observation créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  secretid: { type: string }
                  status: { type: integer, deprecated: true }
                  group: { type: integer, deprecated: true }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /add_image.php:
    post:
      tags: [Contribution]
      summary: Envoyer la photo d'une observation
      description: |
        JPEG uniquement, réduit à 1024 × 1024 pixels au plus ; remplace la photo précédente. Une observation
        approuvée ne peut plus changer de photo sans clé admin/modérateur (403 `ALREADYAPPROVED`, backend ≥ 0.0.22).
        Si l'instance a un serveur de floutage, visages et plaques sont masqués avant l'enregistrement (en-tête
        `X-Vigilo-Blur: done`, ou `failed` : photo enregistrée telle qu'envoyée).
      operationId: addImage
      parameters:
        - $ref: '#/components/parameters/token'
        - name: secretid
          in: query
          required: true
          description: Clé secrète retournée par `create_issue.php`
          schema: { type: string }
        - name: type
          in: query
          description: Photo de l'observation ou de sa résolution (backend ≥ 0.0.14)
          schema: { type: string, enum: [obs, resolution], default: obs }
        - name: method
          in: query
          description: "`stdin` : JPEG brut dans le corps (défaut) ; `base64` : champ `imagebin64` (backend ≥ 0.0.16)"
          schema: { type: string, enum: [stdin, base64], default: stdin }
        - name: key
          in: query
          description: Clé admin/modérateur, pour remplacer la photo d'une observation approuvée (backend ≥ 0.0.22)
          schema: { type: string }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                imagebin64: { type: string, description: JPEG encodé en base64 (avec `method=base64`) }
          application/json:
            schema:
              type: object
              description: Backend ≥ 0.0.22, avec `method=base64`
              properties:
                imagebin64: { type: string, description: "JPEG en base64 (préfixe `data:image/jpeg;base64,` accepté)" }
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /create_resolution.php:
    post:
      tags: [Contribution]
      summary: Créer une résolution
      description: |
        Indique qu'une ou plusieurs observations sont résolues (backend ≥ 0.0.14) ; la résolution est créée avec le
        statut 4 (« indiquée comme résolue »), à valider dans l'admin. Envoyer ensuite la photo avec
        `add_image.php?type=resolution`. Limitation par IP (429 `RATELIMITED`, backend ≥ 0.0.22), sauf avec une clé admin.
      operationId: createResolution
      parameters:
        - $ref: '#/components/parameters/keyOptional'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [time, tokenlist]
              properties:
                tokenlist: { type: string, description: "Tokens des observations résolues, séparés par des virgules" }
                comment: { type: string, maxLength: 50 }
                time: { type: integer, description: "Timestamp Unix en millisecondes ou en secondes" }
                version: { type: string }
      responses:
        '200':
          description: Résolution créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: R_4F2A9C1B }
                  secretid: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /delete.php:
    get:
      tags: [Contribution]
      summary: Supprimer une observation
      description: Avec la clé secrète de l'observation (son auteur) ou une clé admin/modérateur. Supprime l'observation et sa photo.
      operationId: deleteIssue
      parameters:
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/secretidOptional'
        - $ref: '#/components/parameters/keyOptional'
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '400': { $ref: '#/components/responses/Error' }
  /approve.php:
    get:
      tags: [Modération]
      summary: Approuver ou refuser une observation
      description: |
        Clé admin ou modérateur. À l'approbation, les webhooks configurés dans l'admin de l'instance sont appelés
        (backend ≥ 0.0.22). Réponse `{"status": "0"}`.
      operationId: approveIssue
      parameters:
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/key'
        - name: approved
          in: query
          description: "0 : à modérer ; 1 : approuvée (par défaut) ; 2 : refusée"
          schema: { type: integer, enum: [0, 1, 2], default: 1 }
      responses:
        '200': { $ref: '#/components/responses/Status' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /acl.php:
    get:
      tags: [Modération]
      summary: Rôle associé à une clé
      operationId: acl
      parameters:
        - $ref: '#/components/parameters/key'
      responses:
        '200':
          description: Rôle
          content:
            application/json:
              schema:
                type: object
                properties:
                  role:
                    description: "`admin`, `moderator` ou `citystaff` ; `false` si la clé est inconnue"
                    oneOf:
                      - { type: string, example: admin }
                      - { type: boolean, example: false }
        '400': { $ref: '#/components/responses/Error' }
components:
  parameters:
    scope:
      name: scope
      in: query
      required: true
      description: Identifiant du territoire (voir la page de chaque ville)
      schema: { type: string }
      example: 34_montpellier
    scopeOptional:
      name: scope
      in: query
      description: Identifiant du territoire ; sans scope, toutes les observations de l'instance
      schema: { type: string }
      example: 34_montpellier
    token:
      name: token
      in: query
      required: true
      description: Token de l'observation
      schema: { type: string }
    key:
      name: key
      in: query
      required: true
      description: Clé privée d'un compte admin ou modérateur
      schema: { type: string }
    keyOptional:
      name: key
      in: query
      description: Clé privée d'un compte admin ou modérateur
      schema: { type: string }
    secretidOptional:
      name: secretid
      in: query
      description: Clé secrète de l'observation, retournée à sa création
      schema: { type: string }
  responses:
    Status:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: integer, example: 0, description: "Toujours 0 (conservé pour les anciennes applications : le code HTTP fait foi)" }
    Error:
      description: Erreur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            status: { type: integer, example: 404 }
            code: { type: string, example: SCOPENOTEXIST }
            message: { type: string }
    Category:
      type: object
      properties:
        catid: { type: integer }
        catname: { type: string }
        catname_en_US: { type: string, description: "Nom en anglais (facultatif)" }
        catcolor: { type: string, description: 'Nom CSS ou #rrggbb' }
        catresolvable: { type: boolean, description: "Les citoyens peuvent déclarer l'observation résolue" }
        catdisable: { type: boolean, description: "Catégorie à ne plus proposer (facultatif)" }
        catcustom: { type: boolean, description: "Catégorie propre à l'instance (facultatif ; backend ≥ 0.0.23)" }
    City:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        postcode: { type: string }
        area: { type: string }
        population: { type: string }
        website: { type: string }
    Scope:
      type: object
      properties:
        display_name: { type: string }
        department: { type: string }
        coordinate_lat_min: { type: string }
        coordinate_lat_max: { type: string }
        coordinate_lon_min: { type: string }
        coordinate_lon_max: { type: string }
        map_center_string: { type: string, description: '"latitude,longitude" du centre de la carte' }
        map_zoom: { type: string }
        contact_email: { type: string }
        tweet_content: { type: string, description: "Valeur existante, plus modifiable depuis le backend 0.0.23" }
        twitter: { type: string, description: "Valeur existante, plus modifiable depuis le backend 0.0.22" }
        map_url: { type: string }
        nominatim_urlbase: { type: string, description: Backend ≥ 0.0.14 }
        backend_version: { type: string }
        cities:
          type: array
          items: { $ref: '#/components/schemas/City' }
    Issue:
      type: object
      properties:
        token: { type: string, example: 52299F01 }
        coordinates_lat: { type: string }
        coordinates_lon: { type: string }
        address: { type: string }
        comment: { type: string }
        explanation: { type: string }
        time: { type: string, description: Timestamp Unix (secondes) }
        status:
          type: integer
          description: "0 : nouvelle ; 1 : résolue ; 2 : prise en compte ; 3 : en cours de résolution ; 4 : indiquée comme résolue (backend ≥ 0.0.10)"
        group: { type: integer, deprecated: true }
        categorie: { type: string, description: Identifiant de catégorie }
        approved: { type: string, description: "0 : à modérer ; 1 : approuvée ; 2 : refusée" }
        cityname: { type: string, description: "Nom de la ville, absent si inconnu (backend ≥ 0.0.13)" }
        distance: { type: number, description: "Distance en mètres au point `lat`/`lon` (uniquement avec `lat`/`lon`/`radius`)" }
    IssueFeatureCollection:
      type: object
      description: Réponse avec `format=geojson`
      properties:
        type: { type: string, example: FeatureCollection }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string, example: Feature }
              geometry:
                type: object
                properties:
                  type: { type: string, example: Point }
                  coordinates:
                    type: array
                    items: { type: number }
              properties:
                type: object
