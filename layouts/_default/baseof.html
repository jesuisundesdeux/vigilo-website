<!doctype html>
<html lang="{{ site.Language.Locale }}">

</head>
<body class="{{ block "bodyclass" . }}page{{ end }}">
  <a class="skip-link" href="#main">Aller au contenu</a>

    {{ block "main" . }}{{ end }}

  {{ partial "footer.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
